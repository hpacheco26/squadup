<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
    width="100"
    height="100"
>
    <!-- Background -->
    <rect width="100" height="100" fill="#282c34" rx="15" />

    <!-- Circle -->
    <circle cx="20" cy="20" r="12" fill="#fbbc05" />

    <!-- Square -->
    <rect x="40" y="10" width="20" height="20" fill="#34a853" />

    <!-- Triangle -->
    <polygon points="80,30 70,50 90,50" fill="#ea4335" />

    <!-- Pentagon -->
    <polygon points="20,80 10,65 15,50 25,50 30,65" fill="#4285f4" />

    <!-- Hexagon -->
    <polygon points="65,75 55,85 45,75 45,60 55,50 65,60" fill="#ff6d00" />
</svg>
